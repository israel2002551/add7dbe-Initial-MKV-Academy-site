<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Setup | MKV Academy</title>
  <meta name="robots" content="noindex" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { 50: '#f0f7ff', 100: '#e0effe', 600: '#1d4ed8', 700: '#1d40b0', 900: '#1e3a8a' } }, fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'], mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'] } } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/utilities.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased" data-requires-login>
  <div id="loading-screen" aria-hidden="true"><div class="loader-mark">MKV</div></div>
  <div id="scroll-progress"></div>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="navbar"></div>

  <main id="main-content">
    <section id="login-gate" class="min-h-[70vh] flex items-center justify-center bg-gradient-to-br from-slate-900 via-brand-900 to-slate-900 text-white pt-20">
      <div class="container-mkv max-w-lg text-center py-20">
        <h1 class="text-3xl font-extrabold tracking-tight">Log in to edit your profile</h1>
        <button data-login-trigger class="mt-8 inline-flex items-center justify-center rounded-xl bg-brand-600 px-6 py-3 font-semibold text-white shadow-lg shadow-brand-600/25">Log In</button>
        <div id="auth-panel" class="hidden mt-8 mkv-card bg-white text-left p-6">
          <form data-auth-form="login" class="space-y-4">
            <input name="email" type="email" autocomplete="email" required placeholder="Email" class="w-full rounded-lg border border-slate-200 px-4 py-3" />
            <input name="password" type="password" autocomplete="current-password" required placeholder="Password" class="w-full rounded-lg border border-slate-200 px-4 py-3" />
            <button type="submit" class="w-full rounded-xl bg-brand-600 px-5 py-3 font-semibold text-white">Log In</button>
          </form>
          <p data-auth-message class="hidden"></p>
        </div>
      </div>
    </section>

    <section id="gated-content" class="hidden pt-32 pb-20 bg-white">
      <div class="container-mkv max-w-3xl">
        <p class="font-technical text-xs uppercase tracking-widest text-brand-700">Account</p>
        <h1 class="mt-3 text-4xl font-extrabold tracking-tight text-slate-900">Profile Setup</h1>
        <p class="mt-3 text-slate-600">Choose the username and avatar students, instructors, and admins will see across MKV Academy.</p>

        <form id="profile-form" class="mt-8 mkv-card p-6 space-y-5">
          <div class="flex flex-col gap-5 sm:flex-row sm:items-center">
            <div id="profile-avatar-preview" class="h-24 w-24 rounded-full bg-brand-600 text-white shadow-lg shadow-brand-600/20"></div>
            <div class="flex-1">
              <label class="block text-sm font-semibold text-slate-700 mb-2">Profile picture</label>
              <input name="avatar" type="file" accept="image/*" class="w-full text-sm text-slate-600 file:mr-4 file:rounded-lg file:border-0 file:bg-brand-50 file:px-4 file:py-2 file:text-brand-700 file:font-semibold" />
              <p class="mt-2 text-xs text-slate-400">Leave blank to use the default initials avatar.</p>
            </div>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Username</label>
            <input name="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" placeholder="joseph_design" class="w-full rounded-lg border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-600/20 focus:border-brand-600" />
            <p class="mt-2 text-xs text-slate-400">Use letters, numbers, and underscores only.</p>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Full name</label>
            <input name="full_name" autocomplete="name" class="w-full rounded-lg border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-600/20 focus:border-brand-600" />
          </div>
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
            <button type="submit" class="inline-flex items-center justify-center rounded-xl bg-brand-600 px-6 py-3 font-bold text-white shadow-lg shadow-brand-600/25 transition-all hover:bg-brand-700">Save Profile</button>
            <a href="students.html" class="inline-flex items-center justify-center rounded-xl bg-slate-100 px-6 py-3 font-bold text-slate-700 transition-all hover:bg-slate-200">Continue to Portal</a>
          </div>
          <p id="profile-status" class="hidden"></p>
        </form>
      </div>
    </section>
  </main>

  <div id="footer"></div>
  <script src="js/components.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/identity.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/darkmode.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
